[project]
name = "ariablognext-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40.6",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "motor>=3.7.1",
    "pydantic>=2.11.7",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "requests>=2.32.5",
    "uvicorn>=0.35.0",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# 官方 PyPI 作为附加索引（回退用）。清华镜像上没有 vercel-runtime，
# 而 Vercel 构建必须安装它；只把清华设为 default 会导致构建失败：
#   "vercel-runtime was not found in the package registry"
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
